    <main class="container my-4">
        <form>
            <p class="h2 text-center mb-4">Fale conosco:</p>
      
          
          <div class="mb-4">
            <label for="exampleFormControlInput1" class="form-label fw-bold">
              Digite seu email:
            </label>
            <input 
              type="email" 
              class="form-control" 
              id="exampleFormControlInput1" 
              placeholder="name@example.com">
          </div>
      
          
          <fieldset class="mb-4">
            <legend class="col-form-label fs-5 fw-bold mb-3">
              Seu gênero:
            </legend>
      
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="genero" id="feminino">
              <label class="form-check-label" for="feminino">
                Feminino
              </label>
            </div>
      
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="genero" id="masculino">
              <label class="form-check-label" for="masculino">
                Masculino
              </label>
            </div>
      
            <div class="form-check">
              <input class="form-check-input" type="radio" name="genero" id="naoBinario">
              <label class="form-check-label" for="naoBinario">
                Não binário
              </label>
            </div>
          </fieldset>
      
          
          <div class="mb-4">
            <label for="exampleFormControlTextarea1" class="form-label fw-bold">
              Digite sua dúvida ou sugestão:
            </label>
            <textarea 
              class="form-control" 
              id="exampleFormControlTextarea1" 
              rows="3"></textarea>
          </div>
          <div class="mt-3">
            <button type="submit" class="btn btn-primary">
              Enviar
            </button>
          </div>
      
        </form>
      </main>
